# =========================================================
# Archivo: controllers.yaml
# Descripción:
#   Configuración de controladores para ros2_control y Gazebo
#   - Define el controller_manager y los controladores de velocidad y estado articular
#   - Especifica las interfaces y las juntas que controla cada controlador
# =========================================================

controller_manager:
  ros__parameters:
    update_rate: 30  # Frecuencia de actualización del controller_manager (Hz)
    use_sim_time: true  # Usar el tiempo simulado de Gazebo

    # --- Controlador para publicar el estado de las articulaciones ---
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # --- Controlador de velocidad para la rueda derecha (grupo) ---
    velocity_controller_right:
      type: velocity_controllers/JointGroupVelocityController

    # --- Controlador de velocidad para la rueda izquierda (grupo) ---
    velocity_controller_left:
      type: velocity_controllers/JointGroupVelocityController

# --- Parámetros del joint_state_broadcaster ---
joint_state_broadcaster:
  ros__parameters:
    joints:
      - left_wheel_joint   # Nombre de la junta de la rueda izquierda
      - right_wheel_joint  # Nombre de la junta de la rueda derecha
    state_interfaces:
      - velocity           # Publica la velocidad de las juntas
      - position           # Publica la posición de las juntas

# --- Parámetros del controlador de velocidad de la rueda derecha ---
velocity_controller_right:
  ros__parameters:
    joints:
      - right_wheel_joint  # Controla la rueda derecha
    command_interfaces:
      - velocity           # Controla la velocidad de la junta

# --- Parámetros del controlador de velocidad de la rueda izquierda ---
velocity_controller_left:
  ros__parameters:
    joints:
      - left_wheel_joint   # Controla la rueda izquierda
    command_interfaces:
      - velocity           # Controla la velocidad de la junta