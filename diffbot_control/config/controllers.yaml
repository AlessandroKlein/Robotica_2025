# =========================================================
# Archivo: controllers.yaml
# Descripción:
#   Configuración de controladores para ros2_control y Gazebo
#   - Define el controller_manager y los controladores de velocidad y estado articular
#   - Especifica las interfaces y las juntas que controla cada controlador
# =========================================================

controller_manager:
  ros__parameters:
    update_rate: 30

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    velocity_controller:
      type: diff_drive_controller/DiffDriveController

    velocity_controller_l:
      type: velocity_controllers/JointGroupVelocityController

    velocity_controller_r:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint
      - caster_wheel_support_joint
      - caster_wheel_joint
    state_interfaces:
      - position
      - velocity


velocity_controller_l:
  ros__parameters:
    joints:
      - left_wheel_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity


velocity_controller_r:
  ros__parameters:
    joints:
      - right_wheel_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

velocity_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    
    wheel_separation: 0.135
    wheel_radius: 0.035
    
    use_stamped_vel: false
    
    publish_rate: 50.0
    
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    
    open_loop: true
    enable_odom_tf: true
    
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    velocity_rolling_window_size: 10
    
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0
    
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0